name: Fanstik-OS CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install LLVM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld make
      - name: Build UEFI application and kernel
        run: make clean all
      - name: Run host-side tests
        run: make test
